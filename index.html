<!-- Inicio -->
<main id="menu" class="menu">
  <div class="menu-card">
    <div class="brand">
      <svg class="brand-mark" aria-hidden="true"><use href="#logo"/></svg>
      <div>
        <h1>Isla Jurásica</h1>
        <p>Compra dinosaurios, construye recintos y arruina a tus rivales.</p>
      </div>
    </div>
    <button id="resume" class="btn primary big" hidden>Continuar la partida</button>

    <h2>Tablero</h2>
    <div class="modes" id="modes"></div>

    <h2>Máquinas</h2>
    <div class="levels" id="levels"></div>
    <p id="level-hint" class="muted"></p>

    <h2>Jugadores</h2>
    <div class="slots" id="slots"></div>
    <p class="muted">Las personas se pasan el dispositivo. Todo el dinero es visible, como en la mesa.</p>

    <button id="start" class="btn primary big">Empezar</button>
    <button id="rules" class="btn ghost wide">Cómo se juega</button>
  </div>
</main>

<!-- Partida -->
<div id="game" class="game" hidden>
  <header class="topbar">
    <button id="bmenu" class="iconbtn" aria-label="Menú">☰</button>
    <div class="topbar-title"><b>Isla Jurásica</b><span id="round"></span></div>
    <button id="bhelp" class="iconbtn" aria-label="Cómo se juega">?</button>
  </header>
  <section id="players" class="players"></section>
  <section class="boardarea">
    <div class="boardbox" id="boardbox">
      <div class="board" id="board"></div>
      <div class="tokens" id="tokens" aria-hidden="true"></div>
    </div>
  </section>
  <section class="side">
    <div class="acts" id="acts"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/ui.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
